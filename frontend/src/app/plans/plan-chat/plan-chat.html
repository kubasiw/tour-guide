<button
  type="button"
  class="plan-chat__fab btn btn-accent"
  [attr.aria-expanded]="open()"
  [attr.aria-label]="open() ? 'Zamknij asystenta AI' : 'Otwórz asystenta AI'"
  (click)="open.set(!open())"
>
  <i class="bi" [class.bi-chat-dots-fill]="!open()" [class.bi-x-lg]="open()"></i>
</button>

@if (open()) {
  <div class="plan-chat__panel card">
    <div class="card-header d-flex justify-content-between align-items-center py-2">
      <span class="fw-semibold small"><i class="bi bi-chat-dots me-1"></i>Asystent AI</span>
      <button
        type="button"
        class="btn-close"
        aria-label="Zamknij"
        (click)="open.set(false)"
      ></button>
    </div>

    <div class="card-body d-flex flex-column overflow-hidden">
      @if (messages().length > 0) {
        <div class="plan-chat__messages mb-2">
          @for (message of messages(); track $index) {
            <p
              class="plan-chat__message mb-2"
              [class.plan-chat__message--user]="message.role === 'user'"
              [class.plan-chat__message--assistant]="message.role === 'assistant'"
            >
              {{ message.text }}
            </p>
          }
        </div>
      } @else {
        <p class="text-body-secondary small mb-2">
          np. „dodaj jakiś szlak w pobliżu” albo „usuń tę restaurację”.
        </p>
      }

      @if (error(); as message) {
        <ngb-alert type="danger" class="small py-2" [dismissible]="false">
          {{ message }}
        </ngb-alert>
      }

      <div class="input-group">
        <input
          #chatInput
          type="text"
          class="form-control"
          placeholder="np. dodaj jakiś szlak w pobliżu"
          [disabled]="sending()"
          (keydown.enter)="send()"
        />
        <button type="button" class="btn btn-accent" [disabled]="sending()" (click)="send()">
          @if (sending()) {
            <app-loader variant="spinner" />
          } @else {
            <i class="bi bi-send"></i>
          }
        </button>
      </div>
    </div>
  </div>
}
