<div class="container py-4">
  @if (plan.isLoading()) {
    <app-loader variant="spinner" />
  } @else if (plan.value(); as value) {
    <app-stepper [steps]="steps()" />

    <div class="row g-4">
      <div class="col-12 col-lg-7">
        <h1 class="h3 mb-1">Wybierz zainteresowania</h1>
        <p class="text-body-secondary mb-4">Wybierz co najmniej jedną aktywność.</p>

        <div class="d-flex flex-wrap gap-2 mb-4">
          @for (activity of activities; track activity.key) {
            <button
              type="button"
              class="btn"
              [class.btn-primary]="selected().has(activity.key)"
              [class.btn-outline-secondary]="!selected().has(activity.key)"
              (click)="toggle(activity.key)"
            >
              <i class="bi {{ activity.icon }} me-1"></i>{{ activity.label }}
            </button>
          }
        </div>

        @if (errorMessage(); as message) {
          <ngb-alert type="danger" class="mb-3" [dismissible]="false">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ message }}
          </ngb-alert>
        }

        <button
          type="button"
          class="btn btn-primary"
          [class.btn-loading]="submitting()"
          [disabled]="selected().size === 0 || submitting()"
          (click)="submit()"
        >
          <span class="btn-loading__label">Dalej<i class="bi bi-arrow-right ms-1"></i></span>
          @if (submitting()) {
            <app-loader variant="spinner" class="btn-loading__spinner" />
          }
        </button>
      </div>

      <div class="col-12 col-lg-5">
        <app-area-preview [area]="value.area" />
      </div>
    </div>
  }
</div>
