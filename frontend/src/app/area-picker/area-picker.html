<div class="area-picker">
  <div #mapContainer class="area-picker__map"></div>

  @if (area(); as selected) {
    <div class="card mt-3">
      <div class="card-body d-flex justify-content-between align-items-center">
        <app-area-summary [area]="selected" />
        <div>
          <button type="button" class="btn btn-outline-secondary me-2" (click)="clear()">
            <i class="bi bi-x-circle me-1"></i>Clear
          </button>
          <button
            type="button"
            class="btn btn-accent"
            [disabled]="confirming()"
            (click)="confirm()"
          >
            @if (confirming()) {
              <app-loader variant="spinner" />
            } @else {
              <i class="bi bi-check2-circle me-1"></i>Zatwierdź obszar
            }
          </button>
        </div>
      </div>
    </div>
  }

  @if (errorMessage(); as message) {
    <ngb-alert type="danger" class="mt-3" [dismissible]="false">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ message }}
    </ngb-alert>
  }
</div>
