server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Widget (Angular Elements, <tour-guide-mini-map>) — main.js ma stałą nazwę bez hashu
    # (angular.json: outputHashing "none" dla build-element, świadomie, żeby portfolio-shell mogło
    # wskazać go w <script src> na sztywno). Bez agresywnego cache'owania inaczej portfolio-shell
    # dostawałoby starą wersję po każdym redeployu tour-guide. `^~` zatrzymuje dalsze dopasowywanie
    # do regexowej reguły `.js`/`.css` niżej, która inaczej też złapałaby ten plik.
    # Access-Control-Allow-Origin: * — ES module scripty (<script type="module">) ZAWSZE
    # przechodzą przez CORS przy pobieraniu, niezależnie od atrybutu `crossorigin` na tagu (inaczej
    # niż klasyczne <script>), więc bez tego nagłówka przeglądarka odrzuca sam fetch pliku, gdy
    # strona-gospodarz (portfolio-shell) jest na innej domenie — złapane realnie: curl widział
    # 200 OK (nie egzekwuje CORS), ale w prawdziwej przeglądarce fetch kończył się "Failed to
    # fetch". `*`, nie konkretna domena — ten skrypt ma z założenia być osadzalny na dowolnej
    # stronie, nic wrażliwego/z uwierzytelnieniem w nim nie ma.
    location ^~ /elements/ {
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }

    # Główna appka jest SPA — cała nawigacja po stronie klienta, więc nieznana ścieżka i tak
    # wraca do index.html, a routing Angulara ją przejmuje.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
