# Zakłada, że Traefik i wspólny Postgres już działają na VPS jako osobne stacki (patrz
# traefik-docker-compose.yml i postgres-docker-compose.yml w portfolio-shell, i
# INFRA_SETUP.md tam samo) — tworzą zewnętrzne sieci `web` i `db-internal`, do których ten
# stack się podpina. Nie mylić z docker-compose.yml w tym repo — ten drugi to lokalny,
# jednorazowy Postgres do developmentu, nie ma nic wspólnego z tym plikiem.
#
# Ruch API vs frontend rozdzielony przez Traefik na TEJ SAMEJ domenie (tourguide.kubsiw.com) —
# PathPrefix('/api') idzie do backendu, reszta do frontendu. Zero potrzeby osobnej subdomeny
# api.tourguide.*. Backend sam ma app.setGlobalPrefix('api') (main.ts), więc żadnego przepisywania
# ścieżki (stripprefix) po stronie Traefika nie trzeba.
#
# PRZED WDROŻENIEM PODMIEŃ:
#   - TWOJ-USERNAME → Twój login GitHub (właściciel obrazów w ghcr.io)
# I utwórz obok tego pliku na VPS plik backend.env z sekretami (DATABASE_URL/JWT_SECRET/
# JWT_EXPIRES_IN/ANTHROPIC_API_KEY) — patrz backend/.env.example w tym repo jako wzór kluczy.
services:
  backend:
    image: ghcr.io/TWOJ-USERNAME/tour-guide-backend:latest
    container_name: tour-guide-backend
    restart: unless-stopped
    env_file:
      - backend.env
    networks:
      - web
      - db-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tourguide-api.rule=Host(`tourguide.kubsiw.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.tourguide-api.entrypoints=websecure"
      - "traefik.http.routers.tourguide-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.tourguide-api.priority=10"
      - "traefik.http.services.tourguide-api.loadbalancer.server.port=3000"

  frontend:
    image: ghcr.io/TWOJ-USERNAME/tour-guide-frontend:latest
    container_name: tour-guide-frontend
    restart: unless-stopped
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tourguide-frontend.rule=Host(`tourguide.kubsiw.com`)"
      - "traefik.http.routers.tourguide-frontend.entrypoints=websecure"
      - "traefik.http.routers.tourguide-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.tourguide-frontend.priority=1"
      - "traefik.http.services.tourguide-frontend.loadbalancer.server.port=80"

networks:
  web:
    external: true
  db-internal:
    external: true
