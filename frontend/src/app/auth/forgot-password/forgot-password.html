<div class="auth-form">
  <h1 class="h3 mb-3">Zapomniałeś hasła?</h1>

  @if (errorMessage(); as message) {
    <ngb-alert type="danger" [dismissible]="false">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ message }}
    </ngb-alert>
  }

  @if (successMessage(); as message) {
    <ngb-alert type="success" [dismissible]="false">
      <i class="bi bi-check-circle-fill me-2"></i>{{ message }}
    </ngb-alert>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input
          id="email"
          type="email"
          class="form-control"
          formControlName="email"
          [class.is-invalid]="form.controls.email.invalid && form.controls.email.touched"
        />
        <div class="invalid-feedback">Podaj prawidłowy adres e-mail.</div>
      </div>

      <button
        type="submit"
        class="btn btn-primary"
        [class.btn-loading]="submitting()"
        [disabled]="submitting()"
      >
        <span class="btn-loading__label">Wyślij link do resetu hasła</span>
        @if (submitting()) {
          <app-loader variant="spinner" class="btn-loading__spinner" />
        }
      </button>
    </form>
  }

  <p class="mt-3"><a routerLink="/login">Wróć do logowania</a></p>
</div>
