<div class="auth-form">
  <h1 class="h3 mb-3">Ustaw nowe hasło</h1>

  @if (errorMessage(); as message) {
    <ngb-alert type="danger" [dismissible]="false">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ message }}
    </ngb-alert>
  }

  @if (successMessage(); as message) {
    <ngb-alert type="success" [dismissible]="false">
      <i class="bi bi-check-circle-fill me-2"></i>{{ message }}
    </ngb-alert>
    <p class="mt-3"><a routerLink="/login">Zaloguj się</a></p>
  } @else if (!token()) {
    <ngb-alert type="danger" [dismissible]="false">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>Brakuje tokenu resetu hasła w adresie.
      Użyj linku z wiadomości.
    </ngb-alert>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="mb-3">
        <label for="newPassword" class="form-label">Nowe hasło</label>
        <input
          id="newPassword"
          type="password"
          class="form-control"
          formControlName="newPassword"
          [class.is-invalid]="form.controls.newPassword.invalid && form.controls.newPassword.touched"
        />
        <div class="invalid-feedback">Hasło musi mieć co najmniej 8 znaków.</div>
      </div>

      <div class="mb-3">
        <label for="confirmPassword" class="form-label">Powtórz nowe hasło</label>
        <input
          id="confirmPassword"
          type="password"
          class="form-control"
          formControlName="confirmPassword"
          [class.is-invalid]="
            form.controls.confirmPassword.touched &&
            (form.controls.confirmPassword.invalid || form.errors?.['passwordsMismatch'])
          "
        />
        <div class="invalid-feedback">Hasła muszą być takie same.</div>
      </div>

      <button
        type="submit"
        class="btn btn-primary"
        [class.btn-loading]="submitting()"
        [disabled]="submitting()"
      >
        <span class="btn-loading__label">Ustaw nowe hasło</span>
        @if (submitting()) {
          <app-loader variant="spinner" class="btn-loading__spinner" />
        }
      </button>
    </form>
  }
</div>
