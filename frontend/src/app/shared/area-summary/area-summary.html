@let selected = area();

@if (selected.kind === 'polygon') {
  <p class="card-text mb-0">
    <i class="bi bi-pentagon-fill me-2"></i>Polygon with {{ selected.points.length }} points
  </p>
} @else {
  <p class="card-text mb-0">
    <i class="bi bi-record-circle me-2"></i>Center:
    {{ selected.center.lat | number: '1.4-4' }}, {{ selected.center.lng | number: '1.4-4' }}
    — Radius: {{ selected.radiusMeters | number: '1.0-0' }} m
  </p>
}
