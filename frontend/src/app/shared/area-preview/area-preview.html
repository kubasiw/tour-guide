<div class="area-preview">
  <p class="text-body-secondary small mb-2">
    <i class="bi bi-geo-alt-fill me-1"></i>Twój obszar
  </p>
  <div #mapContainer class="area-preview__map"></div>

  @if (activities().length > 0) {
    <div class="d-flex flex-wrap gap-2 mt-3">
      @for (key of activities(); track key) {
        <span class="badge bg-secondary">{{ label(key) }}</span>
      }
    </div>
  }
</div>
