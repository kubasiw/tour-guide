<nav class="navbar navbar-expand bg-body-tertiary sticky-top">
  <div class="container justify-content-between">
    <a routerLink="/" class="navbar-brand mb-0 d-flex align-items-center">
      <i class="bi bi-backpack-fill me-2"></i>{{ title() }}
    </a>
    <div>
      @if (authService.isAuthenticated()) {
        <a routerLink="/my-plans" class="btn btn-outline-secondary me-2">Moje plany</a>
        <span class="navbar-text me-3 d-none d-sm-inline">{{ authService.me.value()?.email }}</span>
        <a
          routerLink="/change-password"
          class="btn btn-outline-secondary me-2"
          aria-label="Zmień hasło"
          title="Zmień hasło"
        >
          <i class="bi bi-gear-fill"></i>
        </a>
        <button type="button" class="btn btn-outline-secondary" (click)="authService.logout()">
          Log out
        </button>
      } @else {
        <a routerLink="/login" class="btn btn-outline-primary me-2">Log in</a>
        <a routerLink="/register" class="btn btn-primary">Register</a>
      }
    </div>
  </div>
  <a href="https://kubsiw.com" target="_blank" rel="noreferrer" class="portfolio-stamp">
    <span class="portfolio-stamp__main">Projekt portfolio</span>
    <span class="portfolio-stamp__sub">Kuba S. →</span>
  </a>
</nav>

<main class="flex-grow-1 d-flex flex-column">
  @if (health.error()) {
    <ngb-alert type="danger" class="rounded-0 mb-0 text-center" [dismissible]="false">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>Nie można połączyć się z serwerem.
    </ngb-alert>
  }

  <router-outlet />
</main>
