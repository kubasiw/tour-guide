<nav class="navbar navbar-expand bg-body-tertiary">
  <div class="container justify-content-between">
    <span class="navbar-brand mb-0 d-flex align-items-center">
      <i class="bi bi-backpack-fill me-2"></i>{{ title() }}
    </span>
    <div>
      @if (authService.isAuthenticated()) {
        <span class="navbar-text me-3">{{ authService.me.value()?.email }}</span>
        <button type="button" class="btn btn-outline-secondary" (click)="authService.logout()">
          Log out
        </button>
      } @else {
        <a routerLink="/login" class="btn btn-outline-primary me-2">Log in</a>
        <a routerLink="/register" class="btn btn-primary">Register</a>
      }
    </div>
  </div>
</nav>

<main class="container py-4">
  @if (health.isLoading()) {
    <app-loader variant="spinner" />
  } @else if (health.error()) {
    <ngb-alert type="danger" [dismissible]="false">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>Backend status: error
    </ngb-alert>
  } @else {
    <p><i class="bi bi-check-circle-fill text-success me-2"></i>Backend status: {{ health.value()?.status }}</p>
  }
</main>

<router-outlet />
