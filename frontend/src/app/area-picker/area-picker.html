<div class="area-picker">
  <div #mapContainer class="area-picker__map"></div>

  @if (area(); as selected) {
    <div class="card mt-3">
      <div class="card-body d-flex justify-content-between align-items-center">
        @if (selected.kind === 'polygon') {
          <p class="card-text mb-0">
            <i class="bi bi-pentagon-fill me-2"></i>Polygon with {{ selected.points.length }} points
          </p>
        } @else {
          <p class="card-text mb-0">
            <i class="bi bi-record-circle me-2"></i>Center:
            {{ selected.center.lat | number: '1.4-4' }}, {{ selected.center.lng | number: '1.4-4' }}
            — Radius: {{ selected.radiusMeters | number: '1.0-0' }} m
          </p>
        }
        <button type="button" class="btn btn-outline-secondary btn-sm" (click)="clear()">
          <i class="bi bi-x-circle me-1"></i>Clear
        </button>
      </div>
    </div>
  }
</div>
