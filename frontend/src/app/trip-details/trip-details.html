<div class="container py-4">
  @if (plan.isLoading()) {
    <app-loader variant="spinner" />
  } @else if (plan.value(); as value) {
    <app-stepper [steps]="steps()" />

    <div class="row g-4 align-items-stretch">
      <div class="col-12 col-lg-7">
        <div class="trip-details-card h-100 d-flex flex-column justify-content-center">
          <h1 class="h3 mb-3">Termin i długość pobytu</h1>

          @if (errorMessage(); as message) {
            <ngb-alert type="danger" [dismissible]="false">
              <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ message }}
            </ngb-alert>
          }

          @if (rangeError()) {
            <ngb-alert type="danger" [dismissible]="false">
              <i class="bi bi-exclamation-triangle-fill me-2"></i>Wybierz datę przyjazdu i wyjazdu
              (wyjazd musi być późniejszy).
            </ngb-alert>
          }

          <div class="mb-3">
            <label for="dateRange" class="form-label">Termin pobytu</label>
            <div class="input-group">
              <input
                id="dateRange"
                type="text"
                class="form-control"
                readonly
                [value]="rangeDisplay()"
                placeholder="Wybierz zakres dat"
                ngbDatepicker
                [autoClose]="false"
                [minDate]="minDate"
                [dayTemplate]="dayTemplate"
                (dateSelect)="onDateSelect($event, dp)"
                #dp="ngbDatepicker"
              />
              <button
                type="button"
                class="btn btn-outline-secondary"
                aria-label="Otwórz kalendarz"
                (click)="dp.toggle()"
              >
                <i class="bi bi-calendar3"></i>
              </button>
            </div>
          </div>

          <button
            type="button"
            class="btn btn-primary"
            [class.btn-loading]="submitting()"
            [disabled]="submitting()"
            (click)="submit()"
          >
            <span class="btn-loading__label">Dalej<i class="bi bi-arrow-right ms-1"></i></span>
            @if (submitting()) {
              <app-loader variant="spinner" class="btn-loading__spinner" />
            }
          </button>
        </div>
      </div>

      <div class="col-12 col-lg-5">
        <app-area-preview [area]="value.area" [activities]="value.activities" />
      </div>
    </div>

    <ng-template #dayTemplate let-date let-focused="focused">
      <span
        class="trip-range-day"
        [class.trip-range-day--range]="isInRange(date)"
        [class.trip-range-day--from]="isFrom(date)"
        [class.trip-range-day--to]="isTo(date)"
        [class.trip-range-day--focused]="focused"
        (mouseenter)="hoveredDate.set(date)"
        (mouseleave)="hoveredDate.set(null)"
      >
        {{ date.day }}
      </span>
    </ng-template>
  }
</div>
