<div class="auth-form">
  <h1 class="h3 mb-3">Log in</h1>

  @if (errorMessage(); as message) {
    <ngb-alert type="danger" [dismissible]="false">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ message }}
    </ngb-alert>
  }

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input
        id="email"
        type="email"
        class="form-control"
        formControlName="email"
        [class.is-invalid]="form.controls.email.invalid && form.controls.email.touched"
      />
      <div class="invalid-feedback">Enter a valid email address.</div>
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input
        id="password"
        type="password"
        class="form-control"
        formControlName="password"
        [class.is-invalid]="form.controls.password.invalid && form.controls.password.touched"
      />
      <div class="invalid-feedback">Password is required.</div>
    </div>

    <button
      type="submit"
      class="btn btn-primary"
      [class.btn-loading]="submitting()"
      [disabled]="submitting()"
    >
      <span class="btn-loading__label">Log in</span>
      @if (submitting()) {
        <app-loader variant="spinner" class="btn-loading__spinner" />
      }
    </button>
  </form>

  <p class="mt-3">No account yet? <a routerLink="/register">Register</a></p>
  <p><a routerLink="/forgot-password">Zapomniałeś hasła?</a></p>
</div>
