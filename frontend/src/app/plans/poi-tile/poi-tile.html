<button
  type="button"
  class="poi-tile card h-100 text-start"
  [class]="colorClass()"
  [class.poi-tile--selected]="selected()"
  [class.poi-tile--hovered]="hovered()"
  (click)="toggled.emit()"
  (mouseenter)="hoverChange.emit(true)"
  (mouseleave)="hoverChange.emit(false)"
>
  <div class="card-body p-2 position-relative">
    @if (selected()) {
      <span class="poi-tile__badge badge bg-primary">
        <i class="bi bi-check-lg"></i>
      </span>
    }
    <i class="bi {{ icon() }} fs-2"></i>
    <div class="fw-semibold text-truncate mt-1">{{ poi().name }}</div>
    @if (poi().openingHours) {
      <div class="small text-body-secondary text-truncate">{{ poi().openingHours }}</div>
    }
  </div>
</button>
