<div class="area-picker">
  @if (plan.error()) {
    <div class="container py-5">
      <ngb-alert type="danger" [dismissible]="false">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>Plan nie został znaleziony.
      </ngb-alert>
    </div>
  } @else {
    @if (steps(); as stepList) {
      <div class="area-picker__stepper-bar">
        <div class="container">
          <app-stepper [steps]="stepList" />
        </div>
      </div>
    }

    <div class="area-picker__map-wrap">
      <div #mapContainer class="area-picker__map"></div>

      <input
        type="search"
        class="area-picker__search form-control"
        placeholder="Szukaj miejsca, np. Karkonosze albo ul. Gdańska"
        aria-label="Szukaj miejsca na mapie"
        [formControl]="searchControl"
        [ngbTypeahead]="searchTypeahead"
        [resultFormatter]="resultFormatter"
        [inputFormatter]="inputFormatter"
        (selectItem)="onSelectItem($event)"
      />

      @if (area(); as selected) {
        <div class="area-picker__confirm-card card">
          <div class="card-body">
            @if (errorMessage(); as message) {
              <ngb-alert type="danger" class="small py-2 mb-2" [dismissible]="false">
                {{ message }}
              </ngb-alert>
            }
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
              <app-area-summary [area]="selected" />
              <div class="d-flex gap-2">
                <button type="button" class="btn btn-outline-secondary" (click)="clear()">
                  <i class="bi bi-x-circle me-1"></i>Clear
                </button>
                <button
                  type="button"
                  class="btn btn-accent"
                  [disabled]="confirming()"
                  (click)="confirm()"
                >
                  @if (confirming()) {
                    <app-loader variant="spinner" />
                  } @else if (id()) {
                    <i class="bi bi-check2-circle me-1"></i>Zapisz zmiany
                  } @else {
                    <i class="bi bi-check2-circle me-1"></i>Zatwierdź obszar
                  }
                </button>
              </div>
            </div>
          </div>
        </div>
      }
    </div>
  }
</div>
