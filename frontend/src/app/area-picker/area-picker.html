<div class="area-picker container py-4">
  @if (plan.error()) {
    <ngb-alert type="danger" class="mb-3" [dismissible]="false">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>Plan nie został znaleziony.
    </ngb-alert>
  }

  @if (steps(); as stepList) {
    <app-stepper [steps]="stepList" />
  }

  <input
    type="search"
    class="form-control mb-3"
    placeholder="Szukaj miejsca, np. Karkonosze albo ul. Gdańska"
    aria-label="Szukaj miejsca na mapie"
    [formControl]="searchControl"
    [ngbTypeahead]="searchTypeahead"
    [resultFormatter]="resultFormatter"
    [inputFormatter]="inputFormatter"
    (selectItem)="onSelectItem($event)"
  />

  <div #mapContainer class="area-picker__map"></div>

  @if (area(); as selected) {
    <div #confirmCard class="card mt-3">
      <div class="card-body d-flex justify-content-between align-items-center">
        <app-area-summary [area]="selected" />
        <div>
          <button type="button" class="btn btn-outline-secondary me-2" (click)="clear()">
            <i class="bi bi-x-circle me-1"></i>Clear
          </button>
          <button
            type="button"
            class="btn btn-accent"
            [disabled]="confirming()"
            (click)="confirm()"
          >
            @if (confirming()) {
              <app-loader variant="spinner" />
            } @else if (id()) {
              <i class="bi bi-check2-circle me-1"></i>Zapisz zmiany
            } @else {
              <i class="bi bi-check2-circle me-1"></i>Zatwierdź obszar
            }
          </button>
        </div>
      </div>
    </div>
  }

  @if (errorMessage(); as message) {
    <ngb-alert type="danger" class="mt-3" [dismissible]="false">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ message }}
    </ngb-alert>
  }
</div>
